# Nginx 配置文件
# 功能：统一3001端口，反向代理前端和API

worker_processes auto;
pid deploy/logs/nginx.pid;
error_log deploy/logs/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    # MIME类型（如果文件不存在会fallback到default_type）
    include mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log deploy/logs/nginx_access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # 上游服务
    upstream backend {
        server 127.0.0.1:9898 max_fails=3 fail_timeout=30s;  # stock-mcp API
    }

    server {
        listen 3001;
        server_name _;

        # 客户端请求体大小限制（文件上传）
        client_max_body_size 100M;

        # LibreChat Agent SSE/控制接口。
        # LibreChat 客户端在可恢复流式回复中硬编码了 /api/agents/chat/stream/*，
        # 若落入下面 stock-mcp 的 /api/ 代理会返回 404，导致回复必须刷新页面才可见。
        location = /api/agents {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Connection '';
        }

        location ^~ /api/agents/ {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # SSE 必须禁用缓冲，否则流式 token/完成事件可能延迟到连接结束。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Connection '';
        }

        # API 请求转发到后端
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 转发请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket支持（如需要）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # LibreChat 反向代理（路径重写：/librechat/ -> /）
        location /librechat/ {
            # 强制HTTPS：如果外层代理传来X-Forwarded-Proto但不是https，则重定向
            if ($http_x_forwarded_proto = "http") {
                return 301 https://$http_host$request_uri;
            }

            proxy_pass http://127.0.0.1:3080/;
            proxy_http_version 1.1;

            # 转发请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # LibreChat 无斜杠重定向（同样强制HTTPS）
        location = /librechat {
            if ($http_x_forwarded_proto = "http") {
                return 301 https://$http_host/librechat/;
            }
            return 301 /librechat/;
        }

        # 明确拦截PWA相关请求（返回404而非fallback到index.html）
        location ~ ^/(registerSW\.js|manifest\.webmanifest|sw\.js|service-worker\.js)$ {
            return 404;
        }

        # 前端静态文件（nginx直接serve）
        location / {
            root frontend/dist;
            try_files $uri $uri/ /index.html;

            # 静态资源缓存
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
